<style>
/* Layout: one narrow column, a top bar with tabs, lesson as a step-by-step track with a highlighter accent for vocabulary */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#18231F; --muted:#5E6B66; --line:#DCE2DE;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --mark:#FFD86B; --mark-ink:#3A2E00;
  --good:#2E8B57; --bad:#C2453D; --soft:#E6EEEA;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211E; --ink:#E6EEEA; --muted:#98A6A0; --line:#2A3531;
  --accent:#5CC2A5; --accent-ink:#0E1A16; --mark:#6B5A1E; --mark-ink:#FFE9A8;
  --good:#5CC28A; --bad:#E5776F; --soft:#1F2B27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211E; --ink:#E6EEEA; --muted:#98A6A0; --line:#2A3531;
  --accent:#5CC2A5; --accent-ink:#0E1A16; --mark:#6B5A1E; --mark-ink:#FFE9A8;
  --good:#5CC28A; --bad:#E5776F; --soft:#1F2B27; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 64px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;background:var(--mark);color:var(--mark-ink);padding:0 6px;border-radius:4px}
nav.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 .9rem var(--f-body);padding:6px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .95rem var(--f-body);padding:10px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{font-size:1.05rem;padding:14px 22px}
.btn.icon{padding:8px 10px}
.btn:disabled{opacity:.5;cursor:default}
.btn.rec{border-color:var(--bad);color:var(--bad)}
button:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.steps{display:flex;gap:4px}
.steps span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps span.done{background:var(--accent)}
.steps span.now{background:var(--mark)}
.lessonhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--soft);padding:4px 10px;border-radius:8px}
.timer.over{color:var(--good)}
.word{font-family:var(--f-display);font-size:2rem;font-weight:800}
.tr{color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:.95rem}
.wcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wcard .en{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.ex{font-style:italic;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{text-align:left;justify-content:flex-start}
.opt.right{background:color-mix(in srgb,var(--good) 18%,var(--surface));border-color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 15%,var(--surface));border-color:var(--bad)}
.text{font-size:1.08rem;line-height:1.85;max-width:65ch}
.text .w{cursor:pointer;border-radius:3px}
.text .w:hover{background:var(--soft)}
.text .w.new{background:var(--mark);color:var(--mark-ink);padding:0 2px}
.gloss{position:sticky;bottom:12px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.gloss b{font-family:var(--f-display)}
.q{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
input[type=text]{width:100%;font:500 1rem var(--f-body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ok{color:var(--good);font-weight:700}
.no{color:var(--bad);font-weight:700}
.target .hit{color:var(--good);font-weight:700}
.target .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.heard{background:var(--soft);border-radius:8px;padding:8px 10px;min-height:2.4em}
.heard .partial{color:var(--muted)}
.dialog{display:flex;flex-direction:column;gap:6px}
.dialog .line{padding:8px 12px;border-radius:10px;background:var(--soft);max-width:85%}
.dialog .line.b{align-self:flex-end;background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.dialog.hide .line{filter:blur(5px);user-select:none}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:340px}
.cal span{aspect-ratio:1;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cal span.l1{background:color-mix(in srgb,var(--accent) 35%,var(--soft));color:var(--ink)}
.cal span.l2{background:color-mix(in srgb,var(--accent) 65%,var(--soft));color:var(--accent-ink)}
.cal span.l3{background:var(--accent);color:var(--accent-ink)}
.cal span.today{outline:2px solid var(--mark)}
.dict{display:flex;flex-direction:column}
.dict .item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lvl{font-size:.75rem;color:var(--muted)}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:90vw;z-index:20}
@media (max-width:480px){h1{font-size:1.6rem}.word{font-size:1.7rem}.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const KEY = "english-hour-v1";
const INTERVALS = [1,3,7,14,30,60];
const STEPS = [{id:"review",name:"Повторение",min:5},{id:"new",name:"Новые слова",min:10},{id:"reading",name:"Reading",min:15},{id:"listening",name:"Listening",min:15},{id:"speaking",name:"Speaking",min:15}];
const ALLWORDS = {}; DAYS.forEach((d,di)=>d.words.forEach(w=>ALLWORDS[w[0]]={en:w[0],tr:w[1],ru:w[2],ex:w[3],day:di}));

function fresh(){return {day:0,words:{},history:{},stats:{words:[0,0],reading:[0,0],listening:[0,0],speaking:[0,0]},updatedAt:0};}
let S = fresh();
try{const raw=localStorage.getItem(KEY); if(raw){S=Object.assign(fresh(),JSON.parse(raw));}}catch(e){}

let db=null, dbRef=null, dbTimer=null, dbBusy=false, dbDirty=false;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(dbRef){dbDirty=true; clearTimeout(dbTimer); dbTimer=setTimeout(flushDb,4000);}
}
async function flushDb(){
  if(!dbRef||dbBusy||!dbDirty) return;
  dbBusy=true; dbDirty=false;
  try{await dbRef.set({json:JSON.stringify(S),updatedAt:S.updatedAt});}catch(e){ if(e&&e.code==="invalid_argument") dbRef=null; }
  dbBusy=false; if(dbDirty) dbTimer=setTimeout(flushDb,4000);
}

function ymd(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return ymd(d);}
const today=()=>ymd();
function hist(){const t=today(); if(!S.history[t]) S.history[t]={sec:0,done:false}; return S.history[t];}
function streak(){let n=0;const d=new Date(); if(!(S.history[ymd(d)]||{}).done) d.setDate(d.getDate()-1);
  while((S.history[ymd(d)]||{}).done){n++;d.setDate(d.getDate()-1);} return n;}
function due(){const t=today();return Object.keys(S.words).filter(w=>S.words[w].due<=t);}
function score(k,ok){S.stats[k][1]++; if(ok) S.stats[k][0]++; save();}

/* ================= AUDIO: TTS + DICTATION ================= */
let tts=null, dict=null, micMode="self";
const cl = window.claude && window.claude.use ? window.claude : null;
if(cl){
  cl.use("tts").then(t=>{tts=t;}).catch(()=>{});
  cl.use("dictation").then(d=>{ if(d){dict=d; micMode="dict"; setupDict(); if(view==="lesson") render();} }).catch(()=>{});
  (async()=>{try{
    const user=await cl.use("user"); const d=await cl.use("db"); const id=user?await user.id():null;
    if(d&&id){ db=d; dbRef=d.doc("data/users/"+id+"/progress");
      const snap=await Promise.race([dbRef.get(),new Promise(r=>setTimeout(()=>r(null),10000))]);
      if(snap&&snap.exists){const b=snap.data(); if(b&&b.updatedAt>S.updatedAt){try{S=Object.assign(fresh(),JSON.parse(b.json)); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} if(view!=="lesson") render();}catch(e){}}}
      else if(S.updatedAt){dbDirty=true; flushDb();}
    }}catch(e){}})();
}
function browserSay(text,rate,pitch){return new Promise(res=>{
  if(!("speechSynthesis" in window)){res();return;}
  const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=rate||1; u.pitch=pitch||1;
  const v=speechSynthesis.getVoices().find(v=>/^en(-|_)(US|GB)/i.test(v.lang)); if(v) u.voice=v;
  u.onend=res; u.onerror=res; speechSynthesis.speak(u);});}
async function say(text,rate){
  rate=rate||1;
  if(tts){try{await tts.speak(text,{rate:Math.max(.7,rate),language:"en"});return;}catch(e){ if(e&&(e.code==="not_granted")) tts=null; else if(e&&e.code!=="rate_limited"&&e.code!=="busy") return; }}
  try{speechSynthesis.cancel();}catch(e){}
  await browserSay(text,rate);
}
async function sayDialog(lines,rate){
  rate=rate||1;
  if(tts){try{await tts.speak(lines.map(l=>({text:l[1],voice:l[0]==="A"?"airy":"rounded",language:"en",rate:Math.max(.7,rate)})));return;}catch(e){ if(e&&e.code==="not_granted") tts=null; else return; }}
  try{speechSynthesis.cancel();}catch(e){}
  for(const l of lines) await browserSay(l[1],rate,l[0]==="A"?1.25:.85);
}

let dictKey=null, dictText="", dictState="idle";
function setupDict(){
  dict.onPartial(({text})=>{const el=document.getElementById("heard-"+dictKey); if(el) el.innerHTML=esc(dictText)+' <span class="partial">'+esc(text)+'</span>';});
  dict.onFinal(({text})=>{dictText+=text; const el=document.getElementById("heard-"+dictKey); if(el) el.textContent=dictText.trim();});
  dict.onState(({state,reason})=>{dictState=state;
    document.querySelectorAll("[data-act=mic]").forEach(b=>{const on=b.dataset.k===dictKey&&state!=="idle"; b.classList.toggle("rec",on); b.textContent=on?"■ Стоп":"🎤 Говорить";});
    if(state==="idle"&&dictKey){const k=dictKey; dictKey=null;
      if(reason==="not_granted"||reason==="unavailable"){micMode="self"; toast("Микрофон недоступен. Включён режим самопроверки."); render(); return;}
      finishSpeak(k,dictText.trim());}
  });
}

/* Browser speech recognition (Chrome / Edge / Android) for the standalone site */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
if(!cl && SR) micMode="web";
function setMicUI(k){document.querySelectorAll("[data-act=mic]").forEach(b=>{const on=b.dataset.k===k; b.classList.toggle("rec",on); b.textContent=on?"■ Стоп":"🎤 Говорить";});}
function webMic(k){
  if(rec){try{rec.stop();}catch(e){} return;}
  dictKey=k; dictText="";
  const el0=document.getElementById("heard-"+k); if(el0) el0.textContent="";
  rec=new SR(); rec.lang="en-US"; rec.interimResults=true; rec.continuous=true;
  rec.onresult=ev=>{let fin="",part=""; for(let i=0;i<ev.results.length;i++){const r=ev.results[i]; if(r.isFinal) fin+=r[0].transcript+" "; else part+=r[0].transcript;}
    dictText=fin; const el=document.getElementById("heard-"+dictKey); if(el) el.innerHTML=esc(fin)+' <span class="partial">'+esc(part)+'</span>';};
  rec.onerror=ev=>{ if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){micMode="self"; toast("Нет доступа к микрофону. Включён режим самопроверки.");} };
  rec.onend=()=>{const kk=dictKey; rec=null; dictKey=null; setMicUI(null); if(micMode==="self"){render();return;} finishSpeak(kk,dictText.trim());};
  try{rec.start(); setMicUI(k);}catch(e){rec=null; dictKey=null; toast("Не удалось включить микрофон.");}
}

/* ================= HELPERS ================= */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let toastT; function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function lemma(w,set){if(set[w]) return w; for(const cut of [["ies","y"],["es",""],["s",""],["ed",""],["ed","e"],["d",""],["ing",""],["ing","e"]]){ if(w.endsWith(cut[0])){const b=w.slice(0,-cut[0].length)+cut[1]; if(set[b]) return b;}} return null;}
function lookup(word,dayData){
  const w=word.toLowerCase().replace(/[’']s$/,"").replace(/[’'].*$/,"");
  const dw={}; dayData.words.forEach(x=>dw[x[0]]=x);
  let k=lemma(w,dw); if(k) return {en:k,ru:dw[k][2],isNew:true};
  if(dayData.gloss[w]) return {en:w,ru:dayData.gloss[w]};
  k=lemma(w,dayData.gloss); if(k) return {en:k,ru:dayData.gloss[k]};
  k=lemma(w,ALLWORDS); if(k) return {en:k,ru:ALLWORDS[k].ru};
  k=lemma(w,BASE)||(BASE[w]?w:null); if(k) return {en:k,ru:BASE[k]};
  return {en:w,ru:null};
}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const pct=a=>a[1]?Math.round(a[0]/a[1]*100):0;

function startLesson(){
  const di=S.day%DAYS.length; const d=DAYS[di];
  const q=shuffle(due()).slice(0,15);
  L={di,d,step:0,stepStart:Date.now(),review:{q,i:0,shown:false,ok:0},
     nw:{phase:"cards",qi:0,order:shuffle(d.words.map(w=>w[0])),ans:null,opts:null,ok:0},
     reading:{ans:{}},listening:{res:{},ans:{},showDialog:false},speaking:{res:{}},done:false};
  view="lesson"; glossW=null; render(); window.scrollTo(0,0);
}

function renderLesson(){
  const st=STEPS[L.step]; const isDone=L.step>=STEPS.length;
  const bar=`<div class="steps">${STEPS.map((s,i)=>`<span class="${i<L.step?"done":i===L.step?"now":""}" title="${s.name}"></span>`).join("")}</div>`;
  if(isDone) return bar+renderSummary();
  const head=`<div class="lessonhead"><div><span class="label">Шаг ${L.step+1} из 5 · ${st.min} мин</span><h2>${st.name}</h2></div><span class="timer" id="timer">${fmt(st.min*60)}</span></div>`;

  const foot=`<div class="foot"><button class="btn" data-act="quit">← Выйти</button><button class="btn primary" data-act="next">${L.step===4?"Завершить урок":"Дальше: "+STEPS[L.step+1].name} →</button></div>`;
  return `<div class="wrap" style="padding:0">${bar}${head}${body}${foot}</div>`;

function rReview(){
  const r=L.review;
  if(!r.q.length) return `<section class="card"><h3>Сегодня повторять нечего</h3><p class="muted">Слова появятся здесь через день после изучения. Переходи к новым словам.</p></section>`;
  if(r.i>=r.q.length) return `<section class="card"><h3>Повторение готово: ${r.ok} из ${r.q.length}</h3><p class="muted">Слова, которые ты не вспомнил, вернутся завтра.</p></section>`;
  const w=ALLWORDS[r.q[r.i]];
  return `<section class="card" style="align-items:center;text-align:center">
    <span class="label">${r.i+1} / ${r.q.length}</span>
    <div class="word">${esc(w.en)}</div><div class="tr">${esc(w.tr)}</div>
    <button class="btn icon" data-act="say" data-t="${esc(w.en)}">🔊</button>
    ${r.shown?`<p style="font-size:1.2rem;font-weight:700">${esc(w.ru)}</p><p class="ex">${esc(w.ex)}</p>
      <div class="row" style="justify-content:center"><button class="btn" data-act="rev" data-ok="0">Не помню</button><button class="btn primary" data-act="rev" data-ok="1">Знаю</button></div>`
    :`<button class="btn primary" data-act="show">Показать перевод</button>`}
  </section>`;
}

function rNew(){
  const n=L.nw, d=L.d;
  if(n.phase==="cards") return `<section class="card"><p class="muted">Прослушай каждое слово, повтори вслух 2–3 раза и прочитай пример.</p>
    <div class="grid2">${d.words.map(w=>`<div class="wcard"><div class="row" style="justify-content:space-between"><span class="en">${esc(w[0])}</span><button class="btn icon" data-act="say" data-t="${esc(w[0])}">🔊</button></div>
    <span class="tr">${esc(w[1])}</span><b>${esc(w[2])}</b><span class="ex">${esc(w[3])} <button class="btn icon" data-act="say" data-t="${esc(w[3])}" style="padding:2px 6px">🔊</button></span></div>`).join("")}</div>
    <div><button class="btn primary" data-act="quiz">Проверить себя →</button></div></section>`;
  if(n.phase==="quiz"){
    const en=n.order[n.qi]; const w=ALLWORDS[en];
    if(!n.opts){const others=shuffle(Object.values(ALLWORDS).filter(x=>x.en!==en).map(x=>x.ru)).slice(0,3); n.opts=shuffle([w.ru,...others]);}
    return `<section class="card"><span class="label">Тест ${n.qi+1} / ${n.order.length}</span>
      <div class="row"><span class="word">${esc(en)}</span><button class="btn icon" data-act="say" data-t="${esc(en)}">🔊</button></div>
      <div class="opts">${n.opts.map((o,i)=>{let c=""; if(n.ans!==null){ if(o===w.ru)c="right"; else if(i===n.ans)c="wrong";} return `<button class="btn opt ${c}" data-act="nq" data-i="${i}" ${n.ans!==null?"disabled":""}>${esc(o)}</button>`;}).join("")}</div>
      ${n.ans!==null?`<div><button class="btn primary" data-act="nqnext">${n.qi+1<n.order.length?"Следующее слово":"Готово"} →</button></div>`:""}</section>`;
  }
  return `<section class="card"><h3>Новые слова: ${n.ok} из ${n.order.length} верно</h3><p class="muted">Все 6 слов добавлены в словарь. Завтра они появятся в повторении.</p>
    <div class="row">${d.words.map(w=>`<span class="note">${esc(w[0])} · ${esc(w[2])}</span>`).join("")}</div></section>`;
}

function rQuestions(qs,store,prefix){
  return qs.map((q,qi)=>{const a=store[qi]; return `<div class="q"><b>${qi+1}. ${esc(q.q)}</b><div class="opts">${q.o.map((o,oi)=>{let c=""; if(a!==undefined){ if(oi===q.a)c="right"; else if(oi===a)c="wrong";} return `<button class="btn opt ${c}" data-act="${prefix}" data-q="${qi}" data-i="${oi}" ${a!==undefined?"disabled":""}>${esc(o)}</button>`;}).join("")}</div></div>`;}).join("");
}

function rReading(){
  const d=L.d;
  const html=d.text.split(/(\s+)/).map(tok=>{ if(/^\s+$/.test(tok)) return tok;
    const m=tok.match(/^([^A-Za-z’']*)([A-Za-zé’'\-]+)(.*)$/); if(!m) return esc(tok);
    const info=lookup(m[2],d); return esc(m[1])+`<span class="w${info.isNew?" new":""}" data-act="gl" data-w="${esc(m[2])}">${esc(m[2])}</span>`+esc(m[3]);}).join("");
  let g="";
  if(glossW){const info=lookup(glossW,d); g=`<div class="gloss"><span><b>${esc(glossW)}</b> — ${info.ru?esc(info.ru):"нет в словаре урока"}</span><button class="btn icon" data-act="say" data-t="${esc(glossW)}">🔊</button></div>`;}
  return `<section class="card"><p class="muted small">Прочитай текст. Нажми на любое слово, чтобы увидеть перевод. Новые слова выделены. Можно послушать весь текст.</p>
    <div class="row"><button class="btn" data-act="say" data-t="${esc(d.text)}">🔊 Слушать текст</button><button class="btn" data-act="sayslow" data-t="${esc(d.text)}">🐢 Медленно</button></div>
    <div class="text">${html}</div>${g}
    ${rQuestions(d.qs,L.reading.ans,"rq")}</section>`;
}

function rListening(){
  const d=L.d, ls=L.listening;
  const dictHtml=d.phrases.map((p,i)=>{const r=ls.res[i];
    return `<div class="q"><div class="row"><b>Фраза ${i+1}</b><button class="btn icon" data-act="say" data-t="${esc(p)}">🔊</button><button class="btn icon" data-act="sayslow" data-t="${esc(p)}">🐢</button></div>
    <div class="row" style="flex-wrap:nowrap"><input type="text" id="dict-${i}" placeholder="Напиши, что услышал" autocomplete="off" ${r?"disabled":""} value="${r?esc(r.v):""}"><button class="btn" data-act="lcheck" data-i="${i}" ${r?"disabled":""}>Проверить</button></div>
    ${r?(r.ok?`<span class="ok">✓ Верно</span>`:`<span><span class="no">✗</span> Правильно: <b>${esc(p)}</b></span>`):""}</div>`;}).join("");

    <div class="row"><button class="btn primary" data-act="dlg">🔊 Слушать диалог</button><button class="btn" data-act="dlgslow">🐢 Медленно</button><button class="btn" data-act="dlgshow">${ls.showDialog?"Скрыть текст":"Показать текст"}</button></div>
    <div class="dialog ${ls.showDialog?"":"hide"}" aria-hidden="${!ls.showDialog}">${lines}</div>
    ${rQuestions(d.dqs,ls.ans,"lq")}</section>`;

function rSpeaking(){
  const d=L.d, sp=L.speaking;
  const micNote = micMode!=="self"?`Нажми «🎤 Говорить», произнеси фразу по-английски, потом «Стоп».`:`Микрофон здесь недоступен, поэтому режим самопроверки: послушай, повтори вслух 3 раза и отметь результат.`;
  const readT=d.read.map((t,i)=>{const k="r"+i, r=sp.res[k];
    return `<div class="q"><div class="row"><span class="target" style="font-size:1.1rem">${r&&r.marks?r.marks:esc(t)}</span></div>
    <div class="row"><button class="btn icon" data-act="say" data-t="${esc(t)}">🔊</button>${micBtns(k)}</div>
    ${micMode!=="self"?`<div class="heard" id="heard-${k}">${r?esc(r.heard||"—"):""}</div>`:""}
    ${r?`<span class="${r.ok?"ok":"no"}">${r.msg}</span>`:""}</div>`;}).join("");
  const askT=d.ask.map((a,i)=>{const k="a"+i, r=sp.res[k];
    return `<div class="q"><div class="row"><b style="font-size:1.1rem">${esc(a[0])}</b><button class="btn icon" data-act="say" data-t="${esc(a[0])}">🔊</button></div>
    <span class="muted small">Подсказка: ${esc(a[1])}</span>
    <div class="row">${micBtns(k)}</div>
    ${micMode!=="self"?`<div class="heard" id="heard-${k}">${r?esc(r.heard||"—"):""}</div>`:""}
    ${r?`<span class="${r.ok?"ok":"no"}">${r.msg}</span>`:""}</div>`;}).join("");
  return `<section class="card"><p class="note">${micNote}</p><h3>1. Прочитай вслух</h3>${readT}</section>
  <section class="card"><h3>2. Ответь на вопросы</h3><p class="muted small">Отвечай 1–3 предложениями. Ошибки не страшны, главное — говорить.</p>${askT}</section>`;
}
function micBtns(k){
  if(micMode!=="self") return `<button class="btn" data-act="mic" data-k="${k}">🎤 Говорить</button>`;
  return `<button class="btn" data-act="self" data-k="${k}" data-ok="0">Ещё трудно</button><button class="btn primary" data-act="self" data-k="${k}" data-ok="1">Получилось ✓</button>`;
}
function finishSpeak(k,heard){
  const sp=L&&L.speaking; if(!sp) return;
  if(!heard){toast("Ничего не услышал. Попробуй ещё раз, говори чуть громче."); return;}
  if(k[0]==="r"){
    const t=L.d.read[+k.slice(1)]; const hw=new Set(norm(heard).split(" "));
    const parts=t.split(/(\s+)/); let hit=0,tot=0;
    const marks=parts.map(p=>{if(/^\s+$/.test(p)) return p; const n=norm(p); if(!n) return esc(p); tot++; const ok=hw.has(n); if(ok)hit++; return `<span class="${ok?"hit":"miss"}">${esc(p)}</span>`;}).join("");
    const ratio=tot?hit/tot:0, ok=ratio>=.7;
    sp.res[k]={heard,marks,ok,msg:ok?`✓ Отлично: ${hit} из ${tot} слов`:`${hit} из ${tot} слов. Послушай ещё раз и повтори красные слова.`};
    score("speaking",ok);
  }else{
    const n=norm(heard).split(" ").filter(Boolean).length; const ok=n>=3;
    sp.res[k]={heard,ok,msg:ok?`✓ Молодец, ${n} слов на английском!`:`Попробуй ответить полным предложением (по подсказке).`};
    score("speaking",ok);
  }
  render();
}

  const sOk=Object.values(sp).filter(x=>x.ok).length;
  const nres=L.nw.res||{}; const weak=L.d.words.filter(w=>nres[w[0]]===false).map(w=>w[0]);
  return `<div class="wrap" style="padding:0"><section class="card"><span class="label">Урок завершён · серия 🔥 ${streak()}</span><h1>Well done!</h1>
  <div class="stats">
   <div class="stat"><span class="label">Reading</span><b>${rOk}/${L.d.qs.length}</b></div>

function renderStats(){
  const days=[]; const d0=new Date(); d0.setDate(d0.getDate()-34);
  for(let i=0;i<35;i++){const d=new Date(d0); d.setDate(d0.getDate()+i); const k=ymd(d); const h=S.history[k]; const m=h?Math.floor(h.sec/60):0;
    days.push(`<span class="${m>=45||(h&&h.done)?"l3":m>=20?"l2":m>0?"l1":""} ${k===today()?"today":""}" title="${k}: ${m} мин">${d.getDate()}</span>`);}
  const total=Object.values(S.history).reduce((a,h)=>a+h.sec,0);
  const sk=[["Слова","words"],["Reading","reading"],["Listening","listening"],["Speaking","speaking"]];
  return `<section class="card"><h2>Прогресс</h2>
  <div class="stats"><div class="stat"><span class="label">Уроков</span><b>${S.day}</b></div><div class="stat"><span class="label">Часов</span><b>${(total/3600).toFixed(1)}</b></div><div class="stat"><span class="label">Серия</span><b>🔥 ${streak()}</b></div></div>
  <h3>Точность по навыкам</h3>
  ${sk.map(([n,k])=>`<div style="display:flex;flex-direction:column;gap:4px"><div class="row" style="justify-content:space-between"><span>${n}</span><span class="muted small">${S.stats[k][1]?pct(S.stats[k])+"% · "+S.stats[k][0]+" из "+S.stats[k][1]:"пока нет ответов"}</span></div><div class="bar"><span style="width:${pct(S.stats[k])}%"></span></div></div>`).join("")}
  <h3>Последние 5 недель</h3><div class="cal">${days.join("")}</div>
  <p class="muted small">Чем темнее клетка, тем больше минут в этот день.</p>
  <div><button class="btn" data-act="reset">Сбросить прогресс</button></div>
  <div id="resetbox" hidden class="note">Удалить весь прогресс без возможности восстановления? <button class="btn" data-act="resetyes">Да, удалить</button></div>
  </section>`;
}

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="mic"){ // must call start() synchronously from the click
    if(micMode==="web"){webMic(b.dataset.k); return;}
    if(!dict) return;
    if(dictKey&&dictState!=="idle"){dict.stop().catch(()=>{}); return;}
    dictKey=b.dataset.k; dictText=""; const el=document.getElementById("heard-"+dictKey); if(el) el.textContent="";
    dict.start({language:"en"}).catch(err=>{ const c=err&&err.code;
      if(c==="not_granted"||c==="unavailable"){micMode="self"; dictKey=null; toast("Микрофон недоступен. Включён режим самопроверки."); render();}
      else if(c==="dismissed"){dictKey=null; toast("Разреши доступ к микрофону, чтобы проверять речь.");}
      else if(c==="rate_limited"){dictKey=null; toast("Микрофон занят. Попробуй через несколько секунд.");}
      else if(c!=="stopped"){dictKey=null; toast("Не удалось включить микрофон. Попробуй ещё раз.");}
    });
    return;
  }
  ({
    view(){view=b.dataset.v; render(); window.scrollTo(0,0);},
    start(){startLesson();},
    quit(){if(rec) try{rec.abort();}catch(e){} if(dict&&dictState!=="idle") dict.stop().catch(()=>{}); view="home"; L=null; render();},
    next(){ if(rec) try{rec.abort();}catch(e){} if(dict&&dictState!=="idle") dict.stop().catch(()=>{});
      if(L.step===1&&L.nw.phase!=="done") addNewWords();
      L.step++; L.stepStart=Date.now(); glossW=null; render(); window.scrollTo(0,0);},
    say(){say(b.dataset.t,1);},
    sayslow(){say(b.dataset.t,.7);},
    show(){L.review.shown=true; render();},
    rev(){const r=L.review, w=r.q[r.i], ok=b.dataset.ok==="1", s=S.words[w];
      if(ok){s.box=Math.min(s.box+1,INTERVALS.length-1); r.ok++;} else s.box=0;
      s.due=addDays(INTERVALS[s.box]); score("words",ok); r.i++; r.shown=false; render();},
    quiz(){L.nw.phase="quiz"; render();},
    nq(){const n=L.nw; n.ans=+b.dataset.i; const w=ALLWORDS[n.order[n.qi]]; const ok=n.opts[n.ans]===w.ru;
      if(ok) n.ok++; n.res=n.res||{}; n.res[w.en]=ok; score("words",ok); if(!ok) say(w.en,1); render();},
    nqnext(){const n=L.nw; n.qi++; n.ans=null; n.opts=null; if(n.qi>=n.order.length){addNewWords(); n.phase="done";} render();},
    gl(){glossW=b.dataset.w; say(glossW,1); render();},
    rq(){const q=+b.dataset.q, i=+b.dataset.i; L.reading.ans[q]=i; score("reading",L.d.qs[q].a===i); render();},
    lq(){const q=+b.dataset.q, i=+b.dataset.i; L.listening.ans[q]=i; score("listening",L.d.dqs[q].a===i); render();},
    lcheck(){const i=+b.dataset.i, v=document.getElementById("dict-"+i).value; if(!v.trim()){toast("Сначала напиши фразу");return;}
      const ok=norm(v)===norm(L.d.phrases[i]); L.listening.res[i]={v,ok}; score("listening",ok); render();},
    dlg(){sayDialog(L.d.dialog,1);},
    dlgslow(){sayDialog(L.d.dialog,.75);},
    dlgshow(){L.listening.showDialog=!L.listening.showDialog; render();},
    self(){const k=b.dataset.k, ok=b.dataset.ok==="1"; L.speaking.res[k]={ok,msg:ok?"✓ Отмечено":"Повтори ещё пару раз вслух вслед за диктором"}; score("speaking",ok); render();},
    reset(){document.getElementById("resetbox").hidden=false;},
    resetyes(){S=fresh(); save(); render(); toast("Прогресс удалён");}
  })[a]?.();
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("dict-")){ const btn=e.target.parentElement.querySelector("[data-act=lcheck]"); if(btn) btn.click(); }});
document.addEventListener("input",e=>{ if(e.target.id==="dsearch"){const q=e.target.value.toLowerCase().trim(); document.querySelectorAll("#dlist .item").forEach(it=>it.hidden=q&&!it.dataset.s.includes(q));}});

function addNewWords(){
  const res=(L.nw.res)||{};
  L.d.words.forEach(w=>{ if(!S.words[w[0]]){ S.words[w[0]]={box:0,due:addDays(1)}; }});
  save();
}

/* timer + time tracking */
let tick=0;
setInterval(()=>{
  if(view!=="lesson"||!L||document.hidden) return;
  const t=document.getElementById("timer");
  if(t&&L.step<STEPS.length){const left=STEPS[L.step].min*60-(Date.now()-L.stepStart)/1000;
    t.textContent=left>0?fmt(left):"Время вышло ✓"; t.classList.toggle("over",left<=0);}
  const h=hist(); h.sec++; tick++; if(tick%30===0) save();
},1000);
window.addEventListener("pagehide",()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}});

render();
if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
